<h2 class="text-xl font-semibold mt-4 mb-2">Información Adicional</h2>
<ul class="list-disc list-inside text-gray-700">
  <li>Idioma:
    <ul>
      @for (language of profile()!.languages; track $index) {
        <li>{{ language.language }} {{ language.level }} - {{ language.description }}</li>
      }
    </ul>
  </li>
  <li>Modalidad: {{profile().condition.workMode }}</li>
  <li>Disponibilidad: {{profile().condition.availability }}</li>
</ul>
