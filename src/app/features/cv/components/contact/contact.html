<h2 class="section-title">Contacto</h2>
<ul class="section-listnone">
  @if (contact().email) {
    <li class="section-text">
      Correo: <a href="mailto:{{ contact().email }}" class="link">{{contact().email}}</a>
    </li>
  }
  @if (contact().phone) {
    <li class="section-text">
      Teléfono: <a href="tel:{{ contact().phone }}" class="link">{{contact().phone}}</a>
    </li>
  }
  @if (contact().linkedin) {
    <li class="section-text">
      LinkedIn: <a href="{{ contact().linkedin }}" class="link" target="_blank">{{contact().linkedin}}</a>
    </li>
  }
  @if (contact().github) {
    <li class="section-text">
      GitHub: <a href="{{ contact().github }}" class="link" target="_blank">{{contact().github}}</a>
    </li>
  }
</ul>
