<div class="mt-5">
  <!-- Texto -->
  <ul class="section-listnone">
    @for (contacto of sortedContact(); track contacto.typeName + contacto.value) {
      <li class="section-text">
        {{ contacto.displayName }}:

        <a
          [href]="getLink(contacto)"
          class="link"
          [target]="isExternal(contacto) ? '_blank' : null"
          [rel]="isExternal(contacto) ? 'noopener noreferrer' : null"
        >
          {{ contacto.value }}
        </a>
      </li>
    }
  </ul>
</div>
