<h2 class="section-title">Experiencia Profesional</h2>

@for (job of experience(); track job) {
  <div class="mb-4">
    <h3 class="section-meta">{{ job.role }} - {{ job.company }} ({{ job.startDate }} - {{ job.endDate }})</h3>
    <p class="section-text mt-2">{{ job.responsibilities.join('. ') }}.</p>
    <p class="section-textsoft mt-2">
      <span class="underline decoration-solid">Tecnologías:</span> {{ job.skills.join(', ') }}.
    </p>
  </div>
}
